[package]
name = "edge-spike-tools"
version = "0.0.0"
edition = "2021"
publish = false
description = "SPIKE tools for the rustls edge benchmark: certificate generator, backend, load client. Not part of the edge."

[workspace]

[[bin]]
name = "certgen"
path = "src/certgen.rs"

[[bin]]
name = "backend"
path = "src/backend.rs"

[[bin]]
name = "bench"
path = "src/bench.rs"

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[profile.release]
opt-level = 3
lto = "thin"
