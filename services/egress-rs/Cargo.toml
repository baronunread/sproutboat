[package]
name = "sproutboat-egress"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust egress service for the Sproutboat platform (one-for-one replacement of @sproutboat/wire's egress.ts)."

[lib]
name = "sproutboat_egress"
path = "src/lib.rs"

[[bin]]
name = "sproutboat-egress"
path = "src/main.rs"

# Standalone crate: not a member of any other workspace.
[workspace]

[features]
# Test builds only: SB_EGRESS_TEST_RESOLVER=http://127.0.0.1:PORT replaces the
# system resolver with an HTTP stub (used by tools/egress-diff for the DNS
# rebinding test). Never enabled in release artifacts.
test-resolver = []

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal", "time", "sync", "io-util", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"
webpki-roots = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = 3
panic = "unwind"
