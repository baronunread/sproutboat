github:
  users:
    - login: test-admin
      name: Admin Test
      email: admin@example.test
    - login: member
      name: Member Test
      email: member@example.test
    - login: deletable
      name: Deletable Test
      email: deletable@example.test
  oauth_apps:
    - client_id: sproutboat-local
      client_secret: sproutboat-local-secret
      name: Sproutboat local dashboard
      redirect_uris:
        - https://dashboard.sproutboat.localhost/api/auth/callback/github
        # portless falls back to :1355 when it cannot bind 443 (no sudo).
        - https://dashboard.sproutboat.localhost:1355/api/auth/callback/github
