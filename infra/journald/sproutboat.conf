# Installed by install.sh to /etc/systemd/journald.conf.d/sproutboat.conf.
# journald has no per-unit size cap, so this limit is global: it bounds the
# whole journal, including Caddy, control, edge and egress output. A file that
# sorts later in this directory (for example zz-local.conf) overrides it.
[Journal]
SystemMaxUse=256M
SystemMaxFileSize=32M
MaxRetentionSec=1month
