version: 2
updates:
  # Keep the workflow actions current (ci.yml, react-doctor.yml, style-doctor.yml).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Bun deps (root package.json covers apps/web too, one bun.lock). The npm
  # ecosystem can't update bun.lock, so every run failed until this said `bun`.
  # Ignored: @sproutboat/* are our own packages, moved by hand with each tested
  # release (a toolchain bump changes the Porffor compiler).
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "@sproutboat/*"
    groups:
      npm:
        patterns: ["*"]
        update-types: [minor, patch]
