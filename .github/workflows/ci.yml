name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      # Pulls the sproutboat CLI package (github:baronunread/sproutboat-cli#main,
      # public); bun.lock pins the resolved commit.
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      # The tree is fully oxfmt-formatted as of the Tailwind/shadcn migration,
      # so this can gate now — before that it could never have passed.
      - run: bun run fmt:check
      - run: bun test apps/ services/ tests/
      - run: sudo -E "$(command -v bun)" test tests/layout-root.test.ts

  # Playwright against the real local stack: control, edge, the Vite dashboard and the GitHub
  # emulator, all on plain http ports (SPROUTBOAT_E2E_PLAIN, see tools/dev-local.ts) because a
  # runner cannot give Portless :443 or a trusted certificate.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPROUTBOAT_E2E_PLAIN: "1"
      E2E_BASE_URL: http://localhost:4812
      E2E_CONTROL_URL: http://127.0.0.1:4810
      E2E_EMULATOR_URL: http://localhost:4000
      SPROUTBOAT_CONTROL_URL: http://127.0.0.1:4810
      SPROUTBOAT_DASHBOARD_URL: http://localhost:4812
      GITHUB_EMULATOR_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Start the local stack
        run: |
          nohup bun run dev:local > dev-local.log 2>&1 &
          for i in $(seq 1 90); do
            curl -fsS "$E2E_CONTROL_URL/internal/health" >/dev/null 2>&1 && curl -fsS "$E2E_BASE_URL/login" >/dev/null 2>&1 && exit 0
            sleep 2
          done
          cat dev-local.log
          exit 1
      # No separate seed step: global-setup runs `seed --reset --e2e` before the first test, and a
      # second seed straight after would hit Better Auth's sign-in rate limit.
      - run: bun run e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            test-results
            dev-local.log
          if-no-files-found: ignore

  # The Rust egress service (services/egress-rs). Same shape as edge-rs; the
  # differential job runs the Bun egress from node_modules against the Rust one.
  egress-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/egress-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/egress-rs
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo clippy --locked --all-targets --features test-resolver -- -D warnings
      - run: cargo test --locked

  egress-rs-diff:
    needs: egress-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/egress-rs
          key: diff
      # The test-resolver feature (a DNS stub for the rebinding cases) is never in a release artifact.
      - run: bun tools/egress-diff/run.ts --build --out egress-diff-report.md
      - run: cargo build --locked --release --manifest-path services/egress-rs/Cargo.toml
      - run: bun test tools/egress-diff/ts-suite.test.ts
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: egress-diff-report
          path: egress-diff-report.md
          if-no-files-found: ignore

  # Static release binaries for the two architectures the installer supports.
  # Workflow artifacts only: install.sh and `sbctl update` do not fetch them.
  egress-rs-release:
    needs: egress-rs
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/egress-rs
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
        working-directory: services/egress-rs
      - run: file services/egress-rs/target/${{ matrix.target }}/release/sproutboat-egress && ls -l services/egress-rs/target/${{ matrix.target }}/release/sproutboat-egress
      - uses: actions/upload-artifact@v7
        with:
          name: sproutboat-egress-linux-${{ matrix.arch }}
          path: services/egress-rs/target/${{ matrix.target }}/release/sproutboat-egress
          if-no-files-found: error

  # The Rust edge (services/edge-rs). Kept separate from the Bun job so neither
  # waits on the other; the cache keys on the lockfile.
  edge-rs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/edge-rs
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/edge-rs
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # Static release binaries for the two architectures the installer supports.
  # Uploaded as workflow artifacts only: install.sh and `sbctl update` do not
  # fetch them yet (see docs/edge-rs-behaviour.md, deployment section).
  edge-rs-release:
    needs: edge-rs
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            arch: x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/edge-rs
          key: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }}
        working-directory: services/edge-rs
      - run: file services/edge-rs/target/${{ matrix.target }}/release/sproutboat-edge && ls -l services/edge-rs/target/${{ matrix.target }}/release/sproutboat-edge
      - uses: actions/upload-artifact@v7
        with:
          name: sproutboat-edge-linux-${{ matrix.arch }}
          path: services/edge-rs/target/${{ matrix.target }}/release/sproutboat-edge
          if-no-files-found: error
