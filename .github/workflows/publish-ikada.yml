name: publish-ikada

# Publishes @sproutboat/ikada to npm with provenance when an `ikada-v<version>` tag is pushed.
#
#   1. Bump "version" in packages/ikada/package.json on main.
#   2. git tag -a ikada-v0.2.0 -m ikada-v0.2.0 && git push origin ikada-v0.2.0
#
# The tag must match the package version, or the job fails before publishing. A version that is
# already on npm is skipped. The tag pattern does not match the platform's `v*` release tags.
#
# Auth is npm Trusted Publishing (OIDC): no NPM_TOKEN. The trusted-publisher settings live in the
# "fledgling" block of the root package.json and are applied to npm with `npx fledgling sync`
# (first time: `npm login`, then `npx fledgling --yes`, which also claims the package name).
on:
  push:
    tags: ["ikada-v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Trusted Publishing and provenance

jobs:
  publish:
    if: github.repository == 'baronunread/sproutboat'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - name: The tag matches the package version
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          version=$(node -p "require('./packages/ikada/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "ikada-v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match packages/ikada version ${version}" >&2
            exit 1
          fi
      - run: bun run --cwd packages/ikada tokens:check
      - run: bun run typecheck
      - run: bun run test:ikada
      - name: Publish if this version is not on npm yet
        working-directory: packages/ikada
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, nothing to publish"
            exit 0
          fi
          npm publish --access public --provenance
