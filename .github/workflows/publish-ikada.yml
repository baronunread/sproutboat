name: publish-ikada

# Publishes @sproutboat/ikada to npm with provenance. Manual only: run it from main after the
# version in packages/ikada/package.json has been bumped. It skips a version that is already on npm.
#
# Auth, either of:
#   - npm Trusted Publishing (OIDC, no secret): on npmjs.com, package Settings -> Trusted Publisher ->
#     GitHub Actions, user baronunread, repo sproutboat, workflow publish-ikada.yml, and allow direct
#     publishing (as for sproutboat-packages' release.yml). npm needs the package to exist first.
#   - an NPM_TOKEN repository secret (a granular token with publish rights on @sproutboat), which is
#     what the very first publish needs. Optional once Trusted Publishing is set up; npm uses OIDC
#     first and the token only as a fallback.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for Trusted Publishing and provenance

jobs:
  publish:
    if: github.repository == 'baronunread/sproutboat' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest # Trusted Publishing needs npm >= 11.5.1
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/ikada tokens:check
      - run: bun run typecheck
      - run: bun run test:ikada
      - name: Publish if this version is not on npm yet
        working-directory: packages/ikada
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version is already on npm, nothing to publish"
            exit 0
          fi
          npm publish --access public --provenance
