name: build-image

# The Porffor compile toolchain. Rebuilt only when the image, the Porffor pin,
# or the wrap/patch logic changes. Published to GHCR; the CLI pulls it.
on:
  push:
    branches: [main]
    paths:
      - build-image/**
      - tools/patch-porffor.ts
      - tools/compile.ts
      - tools/native-fetch-prelude.js
      - patches/**
      - bun.lock
      - .github/workflows/build-image.yml
  workflow_dispatch:

concurrency:
  group: build-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: build-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/build:latest
            ghcr.io/${{ github.repository }}/build:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
