[package]
name = "edge-bench-loadgen"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[[bin]]
name = "loadgen"
path = "src/main.rs"

[[bin]]
name = "fake-upstream"
path = "src/bin/fake-upstream.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
hyper = { version = "1", features = ["http1", "client", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[profile.release]
opt-level = 3
lto = "thin"
